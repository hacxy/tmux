# ==================================================
#  Tmux 配置
#  前缀键: <C-a>
# ==================================================

# ==================== 插件管理（TPM） ====================
# 插件列表
set -g @plugin 'tmux-plugins/tmux-sensible'  # 基础优化插件，解决 ESC 响应延迟等问题
set -g @plugin 'wfxr/tmux-fzf-url#legacy'        # fzf 弹窗列出窗格内所有 URL，过滤选择后打开（用 grep 提取，无需 xre；主版本依赖的 xre 无 macOS ARM 预编译）
set -g @plugin 'tmux-plugins/tmux-yank'          # 复制模式选中内容直接进系统剪贴板
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'  # 窗口名自动显示程序 Nerd Font 图标
set -g @plugin 'alexwforsythe/tmux-which-key'    # prefix + space 显示按键帮助
set -g @plugin 'dreknix/tmux-primary-ip'         # 主网卡 IP（提供 #{primary_ip}）
set -g @plugin 'omerxx/tmux-sessionx'            # prefix + o 会话管理器（依赖 fzf）
set -g @plugin 'catppuccin/tmux'                 # catppuccin 主题（状态栏配色）
set -g @plugin 'tmux-plugins/tpm'             # Tmux 插件管理器（TPM）

# ==================== 基础设置 ====================
set -g default-terminal "tmux-256color"                # 终端类型，启用 256 色
set-option -ga terminal-overrides ",xterm-256color:Tc" # 追加终端覆盖，启用真彩色（truecolor）

set -g base-index 1        # 窗口编号从 1 开始（默认从 0 开始）
set -g pane-base-index 1   # 窗格编号从 1 开始
set -g renumber-windows on # 删除窗口后自动重排编号，不留空缺

set -g mouse on            # 启用鼠标支持（选择文本、调整窗格大小等）

# ==================== 终端增强（yazi 图片预览支持） ====================
set -g allow-passthrough on           # 允许 DCS 直通，yazi 等程序可在终端显示图片
set -s extended-keys on               # 启用扩展按键支持
set -s extended-keys-format csi-u     # 扩展按键使用 CSI-u 格式
set -as terminal-features 'xterm*:extkeys'  # 为 xterm 类终端启用扩展按键特性

set -ga update-environment TERM          # 将 TERM 变量同步到 tmux 会话环境
set -ga update-environment TERM_PROGRAM  # 将 TERM_PROGRAM 变量同步到 tmux 会话环境
set -g visual-activity off               # 关闭活动指示，避免其他窗格输出时状态栏闪烁

# ==================== 复制模式（vi 键位） ====================
set-window-option -g mode-keys vi  # 复制模式使用 vi 键位
bind-key -T copy-mode-vi v send-keys -X begin-selection           # v：开始选择
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle        # C-v：切换矩形选择
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel # y：复制选中内容并退出复制模式

# ==================== 前缀键 ====================
unbind C-b        # 取消默认前缀键 C-b
set -g prefix C-a # 设置前缀键为 C-a

# ==================== 窗口与窗格操作 ====================
bind d split-window -v  # 前缀 + - ：水平分割窗格（上下排列）
bind s split-window -h  # 前缀 + _ ：垂直分割窗格（左右排列）

# 窗格切换（前缀 + h/j/k/l）
bind -r h select-pane -L  # 焦点向左移动
bind -r j select-pane -D  # 焦点向下移动
bind -r k select-pane -U  # 焦点向上移动
bind -r l select-pane -R  # 焦点向右移动

bind > swap-pane -D  # 前缀 + > ：当前窗格与下方窗格交换
bind < swap-pane -U  # 前缀 + < ：当前窗格与上方窗格交换

# 窗格大小调整（前缀 + Ctrl + h/j/k/l，按住可重复）
bind -r c-h resize-pane -L 2  # 向左扩展 2 格
bind -r c-j resize-pane -D 2  # 向下扩展 2 格
bind -r c-k resize-pane -U 2  # 向上扩展 2 格
bind -r c-l resize-pane -R 2  # 向右扩展 2 格

# ==================== 会话与窗口快速切换 ====================
# Alt + 1~5：切换到指定会话
bind -n M-1 switch-client -t Onns  # 切换到会话 Onns
bind -n M-2 switch-client -t un    # 切换到会话 un
bind -n M-3 switch-client -t 3     # 切换到会话 3
bind -n M-4 switch-client -t 4     # 切换到会话 4
bind -n M-5 switch-client -t 5     # 切换到会话 5

# Ctrl + 1~9：直接切换到对应编号的窗口
bind -n C-1 select-window -t :1  # 切换到窗口 1
bind -n C-2 select-window -t :2  # 切换到窗口 2
bind -n C-3 select-window -t :3  # 切换到窗口 3
bind -n C-4 select-window -t :4  # 切换到窗口 4
bind -n C-5 select-window -t :5  # 切换到窗口 5
bind -n C-6 select-window -t :6  # 切换到窗口 6
bind -n C-7 select-window -t :7  # 切换到窗口 7
bind -n C-8 select-window -t :8  # 切换到窗口 8
bind -n C-9 select-window -t :9  # 切换到窗口 9

# ==================== 状态栏（catppuccin v2 模块化） ====================
# 参考: catppuccin/tmux v2 模块化写法（@catppuccin_status_* 模块 + custom_modules）
# 插件数据目录（与 setup.sh 一致）
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins/'

# ---- catppuccin v2 配置 ----
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags 'none'
set -g @catppuccin_window_text '#W'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_text_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# 加载 catppuccin（在选项设置后重新 source，生成 @catppuccin_status_* 模块变量）
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# 自定义模块：主 IP（文件在 custom_modules/ 目录）
source -F '#{d:current_file}/custom_modules/primary_ip.conf'

# ---- 状态栏左右布局 ----
set -g allow-rename off
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -gF status-right '#{E:@catppuccin_status_primary_ip}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

# pi agent 专属图标：pane 标题含 π（ghostty 终端标题）时显示 π，
# 其余程序由 nerd-font-window-name 插件按进程名匹配图标（#{window_icon} 占位符由插件替换）
set -g automatic-rename-format '#{?#{&&:#{m:*π*,#{pane_title}},#{==:#{pane_current_command},node}},󰐀,#{window_icon}}'

# ---- 初始化 TPM：加载所有插件 ----
# 必须放在末尾：tmux-primary-ip 等插件只在加载时对 status-left/right
# 做 #{primary_ip} 的 #(脚本) 插值替换，故需在 status 设置之后加载
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
