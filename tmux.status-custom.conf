# ===== 状态栏自定义样式 (覆盖 catppuccin 插件生成的默认样式) =====
# 由 scripts/toggle-status.sh 通过 prefix+T 切换, 与插件原始样式互斥:
#   - 本文件: 状态栏背景透明化 + 自定义配色
#   - 插件原始: 重新执行 catppuccin.tmux 恢复
# 前提: 终端本身需开启背景透明 (iTerm2: Transparency / kitty: background_opacity)
# 注意: 若日后修改 @catppuccin_status_modules_left/right 或 window 格式, 需同步下方字符串

set -g status-bg default
# 清除可能残留的 status-style (显式 bg/fg 会优先于 status-bg 渲染)
set -g status-style default

# 窗口单元格底色
setw -g window-status-style "fg=#cdd6f4,bg=default,none"
setw -g window-status-activity-style "fg=#f9e2af,bg=default,none"

# 窗口格式: 只把 bg=#1e1e2e 换成 default (透明), 所有 fg 颜色保持插件原始值不变
setw -g window-status-format "#[fg=#313244,bg=default,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#313244]#W#[fg=#89b4fa,bg=#313244,nobold,nounderscore,noitalics] █#[fg=#313244,bg=#89b4fa]#I#[fg=#89b4fa,bg=default] "
# setw -g window-status-current-format "#[fg=#1e1e2e,bg=default,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=default]#W#{?window_zoomed_flag,(),}#[fg=#fab387,bg=default,nobold,nounderscore,noitalics] █#[fg=#1e1e2e,bg=#fab387]#I#[fg=#fab387,bg=default] "
setw -g window-status-current-format "#[fg=#404159,bg=default,nobold,nounderscore,noitalics]#[fg=default,bg=#404159]#W#{?window_zoomed_flag,(),}#[fg=#fab387,bg=#404159,nobold,nounderscore,noitalics] █#[fg=#1e1e2e,bg=#fab387]#I#[fg=#fab387,bg=default] "


# 左右模块: 同样只改 bg, 保留所有 fg
set -g status-left  "#[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=default,nobold,nounderscore,noitalics] #[fg=#1e1e2e,bg=#{?client_prefix,#f38ba8,#a6e3a1},nobold,nounderscore,noitalics] #[fg=#cdd6f4,bg=#313244] #S#[fg=#313244,bg=default,nobold,nounderscore,noitalics] "
set -g status-right "#[fg=#f5c2e7,bg=default,nobold,nounderscore,noitalics] #[fg=#1e1e2e,bg=#f5c2e7,nobold,nounderscore,noitalics] #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path}#[fg=#313244,bg=default,nobold,nounderscore,noitalics] "
